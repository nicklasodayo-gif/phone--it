<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Phone It</title>
    <link rel="icon"type="image/png"href="assets/images/FAVICON/android-chrome-192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">

</head>

<body class="bg-light">
    <header class="bg-dark p-3">

        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="text-white"> Phone It</h1>

            <nav>
                <a href="index.html" class="text-white me-3 text-decoration-none">  Home</a>
                <a href="about.html"class="text-white me-3 text-decoration-none"> About </a>
                <a href="products.html"class="text-white text-decoration-none">Products</a>
            </nav>
</div>
</header>

    <section class="bg-warning text-center p-5">
        <div class="container">
            <h1 class="display-4 fw-bold">Contact Us </h1>

            <p class="lead">We would love to hear from you.</p>
        </div>

    </section>

    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <form>
                    <div class="mb-3">
                        <input type="text" id="name" placeholder="Enter your name">
                        <button onclick="showName()">Submit</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"> Email Address</label>
                        <input type="email"class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel"class="form-control" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="Write your message"> </textarea>
                    </div>

                    <button type="submit" class="btn btn-dark w-100"> Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <section class="container text-center my-5">
        <h2 class="mb-4"> Reach Us</h2>

        <p>
            <strong>Email:</strong>
            nicklasodayo@gmail.com
        </p>

        <p>
            <strong>WhatsApp:</strong>
            0746867743
        </p>

        <p>
            <strong>Instagram:</strong>
            @newphoneit67
        </p>

    </section>

    <footer class="bg-dark text-white text-center p-4">

        <div class="container">

            <p class="mb-1">
                &copy; 2026 Phone It.
                All Rights Reserved.
            </p>

            <p class="mb-0">
                Follow us on social media
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
